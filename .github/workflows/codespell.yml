# Codespell configuration is within .codespellrc
---
name: Codespell

on:
  # Lets the workflow be started by hand from the Actions tab, on any
  # branch, without needing a push or a pull request.  Useful for
  # re-running after a repository setting changes, such as switching on
  # Pages or adding a registry credential.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  codespell:
    name: Check for spelling errors
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Codespell
        uses: codespell-project/actions-codespell@v2
