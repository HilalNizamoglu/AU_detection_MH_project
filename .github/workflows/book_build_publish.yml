name: Build and Publish Book

# The events/triggers when it should be run
# The book is built on every push and pull request so that a broken
# notebook or table of contents is caught early, and published to
# GitHub Pages only from main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permissions the Pages deployment needs: id-token for the deploy
# action's OIDC check, pages to publish, contents to check out
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and let a newer push supersede a running
# one rather than queueing behind it
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the book
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Jupyter Book 2 runs on MyST, which is a Node application, so a
      # current Node has to be present whichever way the book is built.
      # A pinned major keeps the build from moving when the runner's
      # default Node does.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The docs extra carries jupyter-book and pdoc. --frozen makes the
      # run fail if uv.lock no longer matches pyproject.toml, rather
      # than silently re-resolving.
      - name: Install the docs dependencies
        run: |
          uv sync --frozen --extra docs

      # The site template and its web libraries are what the book build
      # spends its time on: measured locally, a cold build takes about
      # ten and a half minutes and a warm one thirteen seconds. They are
      # fetched into _build/templates and do not depend on the content,
      # so caching them on the template's own identity keeps every run
      # after the first on the warm path.
      - name: Cache the MyST site template
        uses: actions/cache@v4
        with:
          path: _build/templates
          key: myst-template-book-theme-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            myst-template-book-theme-${{ runner.os }}-

      # The same script that builds the book locally, so what is
      # published is what a local build produces. It writes the book to
      # _build/html and the pdoc API reference to _build/html/api.
      #
      # Notebook execution is off, as set in myst.yml: the outputs
      # committed in each .ipynb are inserted as they are. Re-running
      # them here would need the dataset, which is not in the
      # repository.
      - name: Build the book and the API reference
        env:
          # Pages serves a project site from /<repository>, so the book
          # has to know the prefix its links sit under
          BASE_URL: /${{ github.event.repository.name }}
        run: |
          bash build_book.sh

      - name: Upload the built book as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_build/html

  deploy:
    name: Publish to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    # Published from main only. Pull requests build the book but do
    # not publish it, so a broken table of contents or notebook is
    # caught before it reaches the published site.
    #
    # Publishing also needs Pages switched on for the repository, with
    # the source set to GitHub Actions.
    if: github.event_name == 'push'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
